<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="10">
  <link rel="icon" href="data:,">
  <title>Autoresearch Dashboard - blog-knowledge-extraction</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fafafa; color: #202124; }
    main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .subtle { color: #667085; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; }
    .metric { font-size: 28px; font-weight: 700; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #edf0f2; text-align: left; font-size: 14px; }
    th { background: #f6f8fa; color: #475467; font-weight: 600; }
    .status-baseline { color: #2563eb; font-weight: 700; }
    .status-keep { color: #16803c; font-weight: 700; }
    .status-discard { color: #b42318; font-weight: 700; }
    .bars { display: grid; gap: 8px; }
    .bar-row { display: grid; grid-template-columns: 240px 1fr 48px; gap: 10px; align-items: center; font-size: 14px; }
    .bar-bg { height: 12px; background: #eef2f6; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: #a7d7c5; }
    .chart { width: 100%; height: 220px; }
    .axis { stroke: #d0d5dd; stroke-width: 1; }
    .line { fill: none; stroke: #6aa9ff; stroke-width: 3; }
    .point { fill: #2563eb; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .bar-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Autoresearch Dashboard</h1>
    <p class="subtle">blog-knowledge-extraction. Auto-refreshes every 10 seconds.</p>
    <section class="grid">
      <div class="card"><div>Status</div><div id="status" class="metric">Loading</div></div>
      <div class="card"><div>Best Score</div><div id="best" class="metric">0%</div></div>
      <div class="card"><div>Current Experiment</div><div id="current" class="metric">0</div></div>
    </section>
    <section class="card">
      <svg id="chart" class="chart" role="img" aria-label="Pass rate chart"></svg>
    </section>
    <h2>Experiments</h2>
    <table>
      <thead><tr><th>#</th><th>Score</th><th>Pass Rate</th><th>Status</th><th>Description</th></tr></thead>
      <tbody id="experiments"></tbody>
    </table>
    <h2>Eval Breakdown</h2>
    <section class="card bars" id="breakdown"></section>
  </main>
  <script>
    const data = {
      "skill_name": "blog-knowledge-extraction",
      "status": "complete",
      "current_experiment": 1,
      "baseline_score": 98.0,
      "best_score": 100.0,
      "experiments": [
        {
          "id": 0,
          "score": 48,
          "max_score": 49,
          "pass_rate": 98.0,
          "status": "baseline",
          "description": "original skill; one run per source article across 7 blog materials"
        },
        {
          "id": 1,
          "score": 49,
          "max_score": 49,
          "pass_rate": 100.0,
          "status": "keep",
          "description": "constrain Stage One advice labels to the fixed label set"
        }
      ],
      "eval_breakdown": [
        {"name": "Accept Finished Article As Source", "pass_count": 14, "total": 14},
        {"name": "Stop At Stage One", "pass_count": 14, "total": 14},
        {"name": "Higher-Level Cluster Merging", "pass_count": 14, "total": 14},
        {"name": "Transferable Reframing", "pass_count": 14, "total": 14},
        {"name": "Complete Stage One Contract", "pass_count": 14, "total": 14},
        {"name": "Not-Recommended Material", "pass_count": 14, "total": 14},
        {"name": "Advice Label Consistency", "pass_count": 13, "total": 14}
      ]
    };

    function renderChart(experiments) {
      const svg = document.getElementById('chart');
      const width = 960;
      const height = 220;
      const pad = 34;
      const plotWidth = width - pad * 2;
      const plotHeight = height - pad * 2;
      const points = experiments.map((exp, index) => {
        const x = pad + (experiments.length === 1 ? plotWidth / 2 : index * plotWidth / (experiments.length - 1));
        const y = pad + (100 - exp.pass_rate) * plotHeight / 100;
        return { x, y, label: `#${exp.id} ${exp.pass_rate.toFixed(1)}%` };
      });
      const path = points.map((point, index) => `${index ? 'L' : 'M'} ${point.x} ${point.y}`).join(' ');
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.innerHTML = `
        <line class="axis" x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}"></line>
        <line class="axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${height - pad}"></line>
        <text x="8" y="${pad + 4}" font-size="12" fill="#667085">100%</text>
        <text x="14" y="${height - pad + 4}" font-size="12" fill="#667085">0%</text>
        <path class="line" d="${path}"></path>
        ${points.map(point => `<circle class="point" cx="${point.x}" cy="${point.y}" r="5"><title>${point.label}</title></circle>`).join('')}
      `;
    }

    function load() {
      document.getElementById('status').textContent = data.status;
      document.getElementById('best').textContent = `${data.best_score.toFixed(1)}%`;
      document.getElementById('current').textContent = data.current_experiment;

      document.getElementById('experiments').innerHTML = data.experiments.map(exp => `
        <tr>
          <td>${exp.id}</td>
          <td>${exp.score}/${exp.max_score}</td>
          <td>${exp.pass_rate.toFixed(1)}%</td>
          <td class="status-${exp.status}">${exp.status}</td>
          <td>${exp.description}</td>
        </tr>
      `).join('');

      document.getElementById('breakdown').innerHTML = data.eval_breakdown.map(item => {
        const pct = item.total ? (item.pass_count / item.total * 100) : 0;
        return `<div class="bar-row"><div>${item.name}</div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><div>${pct.toFixed(0)}%</div></div>`;
      }).join('');

      renderChart(data.experiments);
    }
    load();
  </script>
</body>
</html>
